<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Chat</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

  <div class="logo">
    💎 Crystal Chat
  </div>

  <div class="subtitle">
    חדר הצ'אט
  </div>

  <div id="messages" style="
    height:300px;
    overflow-y:auto;
    background:white;
    border-radius:15px;
    padding:15px;
    color:black;
    margin-bottom:15px;
  ">
    <p>👋 ברוכים הבאים ל-Crystal Chat!</p>
  </div>

  <input
    id="messageInput"
    type="text"
    placeholder="כתבי הודעה...">

  <button id="sendButton">
    📤 שליחה
  </button>

</div>

</body>
</html>
