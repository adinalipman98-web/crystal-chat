<!DOCTYPE html>
<html>
<head>
  <title>Crystal Chat ✨</title>
  <style>
    body {
      background: linear-gradient(135deg, #25105c, #0b5fa5);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .box {
      width: 350px;
      margin: 50px auto;
      background: rgba(255,255,255,0.15);
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 0 25px #8ee7ff;
    }

    h1 {
      color: #d9c8ff;
      text-shadow: 0 0 15px #ffffff;
    }

    input {
      width: 90%;
      padding: 12px;
      border-radius: 15px;
      border: none;
      margin: 8px;
    }

    button {
      background: #b67cff;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #8c4fff;
    }
  </style>
</head>

<body>

<div class="box">
  <h1>💎 Crystal Chat ✨</h1>

  <p>ברוכים הבאים לצ'אט הקסום שלך!</p>

  <input placeholder="השם שלך">
  <br>
  <button>כניסה</button>
</div>

</body>
</html>
